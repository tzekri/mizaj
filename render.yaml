# Blueprint Render : base PostgreSQL + service web (Spring Boot qui sert aussi le site React).
# Render → New → Blueprint → choisir ce dépôt.
# Doc : https://render.com/docs/blueprint-spec
#
# Base payante « Basic 256 Mo » (≈ 6-7 $/mois) : pas d'expiration, sauvegardes quotidiennes.
# (Render n'autorise qu'une base gratuite par compte, déjà prise par Nobty, et elle expire après 30 jours.)

databases:
  - name: mizaj-db
    plan: basic-256mb
    diskSizeGB: 1
    databaseName: mizaj
    user: mizaj

services:
  # Nom « mizaj » → adresse https://mizaj.onrender.com. Si l'ancien site statique « mizaj » existe encore
  # sur Render, le supprimer AVANT de synchroniser ce Blueprint (un service ne peut pas changer de runtime).
  - type: web
    name: mizaj
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/public/health
    autoDeploy: true
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: mizaj-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mizaj-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: mizaj-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: mizaj-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mizaj-db
          property: password
      # Secret de signature des jetons, généré aléatoirement par Render.
      - key: JWT_SECRET
        generateValue: true
      # Compte administrateur : Render les demande à la création (non stockés dans Git).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Compte barista de démonstration (barista@mizajcoffee.ma / barista1234). Mettre "false" en production.
      - key: SEED_DEMO
        value: "true"
      # true tant que Twilio n'est pas configuré : le code s'affiche à l'écran au lieu d'être envoyé.
      # À passer à "false" en production (ignoré dès que Twilio Verify est configuré).
      - key: OTP_DEV_MODE
        value: "true"
      # Envoi des codes : Twilio Verify (recommandé). Laisser vide (ou « - ») pour rester en mode démo.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      # SID du service Verify (« VA… »), console Twilio → Verify → Services.
      - key: TWILIO_VERIFY_SID
        sync: false
      # WhatsApp d'abord, SMS en secours (bascule automatique tant que WhatsApp n'est pas relié à Verify).
      - key: TWILIO_VERIFY_CHANNELS
        value: whatsapp,sms
      - key: APP_TIMEZONE
        value: Africa/Casablanca
