# Profil "local" : base H2 en mémoire, aucun PostgreSQL requis.
# Lancer avec :  java -jar target/mizaje-backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=local
spring:
  datasource:
    url: jdbc:h2:mem:mizaje;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
app:
  # Données fictives (≈ 5 mois, 3 coffee shops) pour essayer le tableau de bord. Jamais en production.
  demo-data: ${APP_DEMO_DATA:true}
